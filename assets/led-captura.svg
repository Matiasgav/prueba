<text x="2.0" y="18.0" class="t-title" text-anchor="start">Fracción del flujo total dentro de un semiángulo</text>
<text x="2.0" y="36.0" class="t-sub" text-anchor="start">Modelo I(θ) = I0·cosᵐθ ajustado a la media intensidad de cada LED. La ventana de Ø 5 mm a 7 mm captura</text>
<text x="2.0" y="51.0" class="t-sub" text-anchor="start">en directo hasta α = 19,65°.</text>
