<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" width="720" height="268" role="img" aria-labelledby="ti de">
<title id="ti">Rango de valor por utilización en piping enterrado</title><desc id="de">Barra del costo de implementación y banda del ahorro esperado por utilización.</desc>
<style>
  text { font-family: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","DejaVu Sans",Arial,sans-serif; fill: #16202b; }
  .t-title { font-size: 15px; font-weight: 700; }
  .t-sub   { font-size: 12px; fill: #52514e; }
  .t-lab   { font-size: 12px; }
  .t-labb  { font-size: 12px; font-weight: 600; }
  .t-small { font-size: 11px; fill: #52514e; }
  .t-axis  { font-size: 11px; fill: #8a8880; font-variant-numeric: tabular-nums; }
  .t-val   { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .t-note  { font-size: 10.5px; fill: #8a8880; }
  .t-inv   { fill: #ffffff; }
  .grid    { stroke: #e4e6ea; stroke-width: 1; }
  .axis    { stroke: #c3c2b7; stroke-width: 1; }
  .st-thin { fill: none; stroke: #14496b; stroke-width: 1.6; }
  .st-hair { fill: none; stroke: #8a8880; stroke-width: 1; }
  .st-dash { fill: none; stroke: #8a8880; stroke-width: 1; stroke-dasharray: 4 3; }
</style>
<rect width="720" height="268" fill="#ffffff"/>
<text x="2.0" y="18.0" class="t-title" text-anchor="start">Piping enterrado: rango de valor por utilización</text>
<text x="2.0" y="36.0" class="t-sub" text-anchor="start">Evaluación EPRI SWEEP. El ahorro se expresa como rango acotado, no como valor puntual.</text>
<line x1="200.0" y1="82.0" x2="200.0" y2="176.0" class="grid"/>
<text x="200.0" y="76.0" class="t-axis" text-anchor="middle">0</text>
<line x1="280.0" y1="82.0" x2="280.0" y2="176.0" class="grid"/>
<text x="280.0" y="76.0" class="t-axis" text-anchor="middle">USD 1 M</text>
<line x1="360.0" y1="82.0" x2="360.0" y2="176.0" class="grid"/>
<text x="360.0" y="76.0" class="t-axis" text-anchor="middle">USD 2 M</text>
<line x1="440.0" y1="82.0" x2="440.0" y2="176.0" class="grid"/>
<text x="440.0" y="76.0" class="t-axis" text-anchor="middle">USD 3 M</text>
<line x1="520.0" y1="82.0" x2="520.0" y2="176.0" class="grid"/>
<text x="520.0" y="76.0" class="t-axis" text-anchor="middle">USD 4 M</text>
<line x1="600.0" y1="82.0" x2="600.0" y2="176.0" class="grid"/>
<text x="600.0" y="76.0" class="t-axis" text-anchor="middle">USD 5 M</text>
<text x="2.0" y="104.0" class="t-small" text-anchor="start">Costo de implementación</text>
<path d="M200.0 92.0 H276.0 a4.0 4.0 0 0 1 4.0 4.0 V108.0 a4.0 4.0 0 0 1 -4.0 4.0 H200.0 Z" fill="#c9ced6"/>
<text x="288.0" y="107.0" class="t-val" text-anchor="start">&lt; 1 M</text>
<text x="2.0" y="152.0" class="t-small" text-anchor="start">Ahorro esperado por</text>
<text x="2.0" y="165.0" class="t-small" text-anchor="start">utilización</text>
<rect x="280.0" y="140.0" width="320.0" height="20.0" fill="#2a78d6" rx="4.0"/>
<text x="440.0" y="155.0" class="t-val t-inv" text-anchor="middle">&gt; 1 M   y   &lt; 5 M</text>
<line x1="200.0" y1="176.0" x2="600.0" y2="176.0" class="axis"/>
<rect x="2.0" y="192.0" width="716.0" height="70.0" fill="#f2f6fa" rx="5.0"/>
<rect x="2.0" y="192.0" width="3.0" height="70.0" fill="#14496b" rx="0.0"/>
<text x="14.0" y="212.0" class="t-labb" text-anchor="start">Lectura de negocio</text>
<text x="14.0" y="230.0" class="t-small" text-anchor="start">Payback inmediato o menor a un año y tecnología ya comercialmente implementada en el sector nuclear: valor</text>
<text x="14.0" y="244.0" class="t-small" text-anchor="start">alto con madurez alta. Un crawler genérico de tuberías no es una oportunidad; sólo lo es un whitespace</text>
<text x="14.0" y="258.0" class="t-small" text-anchor="start">geométrico o de despliegue concreto.</text>
<text x="2.0" y="260.0" class="t-note" text-anchor="start">Fuente: EPRI, Plant Modernization Toolbox, MTA-MA-017.</text>
</svg>
