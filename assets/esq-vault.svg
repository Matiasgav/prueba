<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" width="720" height="396" role="img" aria-labelledby="ti de">
<title id="ti">Esquema de vault subterráneo</title><desc id="de">Vault con cables energizados y empalmes inspeccionado desde una unidad de superficie a través de la boca de registro.</desc>
<style>
