<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-labelledby="ti de">
<title id="ti">Mapa de posicionamiento de los candidatos</title><desc id="de">Dispersión de los siete candidatos según madurez comercial hipotética y reutilización de la plataforma existente.</desc>
<style>
  text { font-family: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","DejaVu Sans",Arial,sans-serif; fill: #16202b; }
  .t-title { font-size: 15px; font-weight: 700; }
  .t-sub   { font-size: 12px; fill: #52514e; }
  .t-lab   { font-size: 12px; }
  .t-labb  { font-size: 12px; font-weight: 600; }
  .t-small { font-size: 11px; fill: #52514e; }
  .t-axis  { font-size: 11px; fill: #8a8880; font-variant-numeric: tabular-nums; }
  .t-val   { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .t-note  { font-size: 10.5px; fill: #8a8880; }
  .t-inv   { fill: #ffffff; }
  .grid    { stroke: #e4e6ea; stroke-width: 1; }
  .axis    { stroke: #c3c2b7; stroke-width: 1; }
  .st-thin { fill: none; stroke: #14496b; stroke-width: 1.6; }
  .st-hair { fill: none; stroke: #8a8880; stroke-width: 1; }
  .st-dash { fill: none; stroke: #8a8880; stroke-width: 1; stroke-dasharray: 4 3; }
</style>
<rect width="720" height="500" fill="#ffffff"/>
<text x="2.0" y="18.0" class="t-title" text-anchor="start">Posicionamiento de partida de los siete candidatos</text>
<text x="2.0" y="36.0" class="t-sub" text-anchor="start">Hipótesis de entrada al estudio, no una medición: cada posición debe confirmarse o corregirse con</text>
<text x="2.0" y="51.0" class="t-sub" text-anchor="start">evidencia.</text>
<rect x="60.0" y="74.0" width="500.0" height="280.0" fill="#fafbfc" rx="4.0"/>
<line x1="60.0" y1="74.0" x2="60.0" y2="354.0" class="grid"/>
<text x="60.0" y="370.0" class="t-axis" text-anchor="middle">M0</text>
<line x1="160.0" y1="74.0" x2="160.0" y2="354.0" class="grid"/>
<text x="160.0" y="370.0" class="t-axis" text-anchor="middle">M1</text>
<line x1="260.0" y1="74.0" x2="260.0" y2="354.0" class="grid"/>
<text x="260.0" y="370.0" class="t-axis" text-anchor="middle">M2</text>
<line x1="360.0" y1="74.0" x2="360.0" y2="354.0" class="grid"/>
<text x="360.0" y="370.0" class="t-axis" text-anchor="middle">M3</text>
<line x1="460.0" y1="74.0" x2="460.0" y2="354.0" class="grid"/>
<text x="460.0" y="370.0" class="t-axis" text-anchor="middle">M4</text>
<line x1="560.0" y1="74.0" x2="560.0" y2="354.0" class="grid"/>
<text x="560.0" y="370.0" class="t-axis" text-anchor="middle">M5</text>
<line x1="60.0" y1="74.0" x2="560.0" y2="74.0" class="grid"/>
<line x1="60.0" y1="167.3" x2="560.0" y2="167.3" class="grid"/>
<line x1="60.0" y1="260.7" x2="560.0" y2="260.7" class="grid"/>
<line x1="60.0" y1="354.0" x2="560.0" y2="354.0" class="grid"/>
<text x="310.0" y="388.0" class="t-note" text-anchor="middle">madurez comercial hipotética  →</text>
<text x="10.0" y="214.0" class="t-note" text-anchor="middle" transform="rotate(-90 10.0 214.0)">reutilización de la plataforma RI  →</text>
<text x="52.0" y="120.0" class="t-axis" text-anchor="end">alta</text>
<text x="52.0" y="218.0" class="t-axis" text-anchor="end">media</text>
<text x="52.0" y="316.0" class="t-axis" text-anchor="end">baja</text>
<text x="72.0" y="94.0" class="t-note" text-anchor="start">riesgo técnico dominante</text>
<text x="548.0" y="94.0" class="t-note" text-anchor="end">riesgo comercial dominante</text>
<circle cx="400.0" cy="124.4" r="13" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<text x="400.0" y="128.4" class="t-labb t-inv" text-anchor="middle">A</text>
<text x="420.0" y="128.4" class="t-small" text-anchor="start">Bus isofásico (IPB)</text>
<circle cx="460.0" cy="186.0" r="13" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<text x="460.0" y="190.0" class="t-labb t-inv" text-anchor="middle">B</text>
<text x="440.0" y="190.0" class="t-small" text-anchor="end">HRSG: headers y tubos</text>
<circle cx="220.0" cy="200.0" r="13" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<text x="220.0" y="204.0" class="t-labb t-inv" text-anchor="middle">C</text>
<text x="240.0" y="204.0" class="t-small" text-anchor="start">Vaults subterráneos</text>
<circle cx="510.0" cy="247.6" r="13" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<text x="510.0" y="251.6" class="t-labb t-inv" text-anchor="middle">D</text>
<text x="490.0" y="251.6" class="t-small" text-anchor="end">Piping enterrado</text>
<circle cx="360.0" cy="228.0" r="13" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<text x="360.0" y="232.0" class="t-labb t-inv" text-anchor="middle">E</text>
<text x="380.0" y="232.0" class="t-small" text-anchor="start">Dry casks</text>
<circle cx="460.0" cy="284.0" r="13" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<text x="460.0" y="288.0" class="t-labb t-inv" text-anchor="middle">F</text>
<text x="440.0" y="288.0" class="t-small" text-anchor="end">Penstocks y túneles</text>
<circle cx="160.0" cy="314.8" r="13" fill="#2a78d6" stroke="#ffffff" stroke-width="2"/>
<text x="160.0" y="318.8" class="t-labb t-inv" text-anchor="middle">G</text>
<text x="180.0" y="318.8" class="t-small" text-anchor="start">Vine / everting</text>
<rect x="2.0" y="408.0" width="716.0" height="62.0" fill="#fff8e8" rx="5.0"/>
<rect x="2.0" y="408.0" width="3.0" height="62.0" fill="#fab219" rx="0.0"/>
<text x="14.0" y="430.0" class="t-small" text-anchor="start">Ninguna posición del mapa es un dato: son hipótesis construidas con las fuentes seed. Un candidato puede</text>
<text x="14.0" y="444.0" class="t-small" text-anchor="start">moverse de cuadrante al primer hallazgo de campo.</text>
<text x="2.0" y="494.0" class="t-note" text-anchor="start">Esquema del autor.</text>
</svg>
