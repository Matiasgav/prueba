<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="ti de">
<title id="ti">Geometría del conducto óptico</title><desc id="de">Corte del LED en el fondo de un conducto de aluminio de 5 mm de diámetro y 7 mm de largo, con el cono directo de 19,65 grados hacia la ventana.</desc>
<style>
  text { font-family: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","DejaVu Sans",Arial,sans-serif; fill: #16202b; }
  .t-title { font-size: 15px; font-weight: 700; }
  .t-sub   { font-size: 12px; fill: #52514e; }
  .t-lab   { font-size: 12px; }
  .t-labb  { font-size: 12px; font-weight: 600; }
  .t-small { font-size: 11px; fill: #52514e; }
  .t-axis  { font-size: 11px; fill: #8a8880; font-variant-numeric: tabular-nums; }
  .t-val   { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .t-note  { font-size: 10.5px; fill: #8a8880; }
  .t-inv   { fill: #ffffff; }
  .grid    { stroke: #e4e6ea; stroke-width: 1; }
  .axis    { stroke: #c3c2b7; stroke-width: 1; }
  .st-thin { fill: none; stroke: #14496b; stroke-width: 1.6; }
  .st-hair { fill: none; stroke: #8a8880; stroke-width: 1; }
  .st-dash { fill: none; stroke: #8a8880; stroke-width: 1; stroke-dasharray: 4 3; }
</style>
<rect width="720" height="470" fill="#ffffff"/>
<text x="2.0" y="18.0" class="t-title" text-anchor="start">Geometría del módulo: LED, conducto y ventana</text>
<text x="2.0" y="36.0" class="t-sub" text-anchor="start">Corte longitudinal a escala 1 mm = 30 px. El cono verde es lo que la ventana ve en forma directa; las</text>
<text x="2.0" y="51.0" class="t-sub" text-anchor="start">líneas punteadas marcan la media intensidad del LED (±40°).</text>
<defs><pattern id="hal" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#b9bec6"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8d949e" stroke-width="1.2"/></pattern></defs>
<rect x="137.0" y="162.0" width="38.0" height="238.0" fill="url(#hal)" rx="0.0"/>
<rect x="325.0" y="162.0" width="38.0" height="238.0" fill="url(#hal)" rx="0.0"/>
<rect x="127.0" y="400.0" width="246.0" height="16.0" fill="#3d6b50" rx="2.0"/>
<text x="379.0" y="412.0" class="t-small" text-anchor="start">PCB / MCPCB</text>
<rect x="205.0" y="370.0" width="90.0" height="30.0" fill="#e9e4d6" rx="2.0" stroke="#8d949e" stroke-width="1"/>
<path d="M214.0 370.0 A36.0 36.0 0 0 1 286.0 370.0 Z" fill="#fff4cf" stroke="#fab219" stroke-width="1"/>
<rect x="137.0" y="162.0" width="226.0" height="10.0" fill="#dbe7f3" rx="0.0" stroke="#14496b" stroke-width="1"/>
<path d="M250.0 382.0 L175.0 172.0 L325.0 172.0 Z" fill="#1baf7a" fill-opacity="0.18" stroke="#1baf7a" stroke-width="1.4"/>
<path d="M250.0 382.0 L175.0 292.6" class="st-dash"/>
<path d="M250.0 382.0 L325.0 292.6" class="st-dash"/>
<path d="M250.0 312.0 A70 70 0 0 1 273.5 316.1" class="st-hair"/>
<line x1="250.0" y1="382.0" x2="250.0" y2="172.0" class="grid"/>
<text x="270.0" y="304.0" class="t-labb" text-anchor="start">α = 19,65°</text>
<line x1="103.0" y1="382.0" x2="103.0" y2="172.0" class="st-thin"/>
<line x1="97.0" y1="382.0" x2="109.0" y2="382.0" class="st-thin"/>
<line x1="97.0" y1="172.0" x2="109.0" y2="172.0" class="st-thin"/>
<text x="93.0" y="277.0" class="t-labb" text-anchor="end">7 mm</text>
<line x1="175.0" y1="146.0" x2="325.0" y2="146.0" class="st-thin"/>
<line x1="175.0" y1="140.0" x2="175.0" y2="152.0" class="st-thin"/>
<line x1="325.0" y1="140.0" x2="325.0" y2="152.0" class="st-thin"/>
<text x="250.0" y="138.0" class="t-labb" text-anchor="middle">Ø 5 mm (ventana / difusor)</text>
<path d="M367.0 167.0 H462.0" class="st-hair"/>
<text x="470.0" y="165.0" class="t-lab" text-anchor="start">Ventana circular con difusor</text>
<text x="470.0" y="180.0" class="t-small" text-anchor="start">transmisión supuesta 75–90 %</text>
<path d="M367.0 226.0 H462.0" class="st-hair"/>
<text x="470.0" y="224.0" class="t-lab" text-anchor="start">Pared de aluminio fresado, no pulido</text>
<text x="470.0" y="239.0" class="t-small" text-anchor="start">reflectividad y especularidad inciertas</text>
<path d="M367.0 316.0 H462.0" class="st-hair"/>
<text x="470.0" y="314.0" class="t-lab" text-anchor="start">Media intensidad (±40°)</text>
<text x="470.0" y="329.0" class="t-small" text-anchor="start">impacta la pared a ≈3 mm del emisor</text>
<path d="M367.0 373.0 H462.0" class="st-hair"/>
<text x="470.0" y="371.0" class="t-lab" text-anchor="start">OSLON SSL 80, 3,0 × 3,0 mm</text>
<text x="470.0" y="386.0" class="t-small" text-anchor="start">lente de silicona, emisión 80°</text>
<text x="2.0" y="462.0" class="t-note" text-anchor="start">Esquema del autor sobre la geometría indicada; plano del emisor aproximado dentro de la lente.</text>
</svg>
