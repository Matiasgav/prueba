<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 396" width="720" height="396" role="img" aria-labelledby="ti de">
<title id="ti">Esquema de acceso a un condensador refrigerado por aire</title><desc id="de">Ducto de distribución superior con registro de acceso y robot, módulos en A con haces de tubos, ductos de condensado y ventiladores.</desc>
