<rect x="92.0" y="111.0" width="56.0" height="9.0" fill="#ffffff" rx="0.0" stroke="#14496b" stroke-width="1.4"/>
<rect x="262.0" y="172.0" width="58.0" height="20.0" fill="#eb6834" rx="4.0"/>
<circle cx="276" cy="195.0" r="5" fill="#8c4520"/>
<circle cx="306" cy="195.0" r="5" fill="#8c4520"/>
<path d="M320 175.0 l13 -7 v14 Z" fill="#2a78d6"/>
<path d="M262 180.0 C 220 160.0, 150 146.0, 120 111.0" class="st-dash"/>
<path d="M120.0 90.0 L120.0 111.0" class="st-hair"/>
