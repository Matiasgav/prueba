<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="ti de">
<title id="ti">Proceso de evaluación por candidato</title><desc id="de">Cinco etapas encadenadas con un filtro de clasificación de evidencia aplicado a todas.</desc>
<style>
  text { font-family: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","DejaVu Sans",Arial,sans-serif; fill: #16202b; }
  .t-title { font-size: 15px; font-weight: 700; }
  .t-sub   { font-size: 12px; fill: #52514e; }
  .t-lab   { font-size: 12px; }
  .t-labb  { font-size: 12px; font-weight: 600; }
  .t-small { font-size: 11px; fill: #52514e; }
  .t-axis  { font-size: 11px; fill: #8a8880; font-variant-numeric: tabular-nums; }
  .t-val   { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .t-note  { font-size: 10.5px; fill: #8a8880; }
  .t-inv   { fill: #ffffff; }
  .grid    { stroke: #e4e6ea; stroke-width: 1; }
  .axis    { stroke: #c3c2b7; stroke-width: 1; }
  .st-thin { fill: none; stroke: #14496b; stroke-width: 1.6; }
  .st-hair { fill: none; stroke: #8a8880; stroke-width: 1; }
  .st-dash { fill: none; stroke: #8a8880; stroke-width: 1; stroke-dasharray: 4 3; }
</style>
<rect width="720" height="300" fill="#ffffff"/>
<text x="2.0" y="18.0" class="t-title" text-anchor="start">Proceso de evaluación por candidato</text>
<text x="2.0" y="36.0" class="t-sub" text-anchor="start">Cada etapa puede descartar el candidato; el orden evita gastar esfuerzo en oportunidades ya cerradas.</text>
<rect x="2.0" y="62.0" width="128.0" height="96.0" fill="#f2f6fa" rx="5.0"/>
<rect x="2.0" y="62.0" width="3.0" height="96.0" fill="#14496b" rx="0.0"/>
<text x="14.0" y="82.0" class="t-note" text-anchor="start">Etapa 1</text>
<text x="14.0" y="100.0" class="t-labb" text-anchor="start">Dolor económico</text>
<text x="14.0" y="118.0" class="t-small" text-anchor="start">Costo actual, outage,</text>
<text x="14.0" y="131.0" class="t-small" text-anchor="start">horas-hombre,</text>
<text x="14.0" y="144.0" class="t-small" text-anchor="start">riesgo</text>
<path d="M134.0 110.0 h10 l-4 -4 m4 4 l-4 4" fill="none" stroke="#8a8880" stroke-width="1.6"/>
<rect x="150.0" y="62.0" width="128.0" height="96.0" fill="#f2f6fa" rx="5.0"/>
<rect x="150.0" y="62.0" width="3.0" height="96.0" fill="#14496b" rx="0.0"/>
<text x="162.0" y="82.0" class="t-note" text-anchor="start">Etapa 2</text>
<text x="162.0" y="100.0" class="t-labb" text-anchor="start">Búsqueda</text>
<text x="162.0" y="114.0" class="t-labb" text-anchor="start">histórica</text>
<text x="162.0" y="132.0" class="t-small" text-anchor="start">Programas previos,</text>
<text x="162.0" y="145.0" class="t-small" text-anchor="start">EPRI, patentes,</text>
<text x="162.0" y="158.0" class="t-small" text-anchor="start">fracasos</text>
<path d="M282.0 110.0 h10 l-4 -4 m4 4 l-4 4" fill="none" stroke="#8a8880" stroke-width="1.6"/>
<rect x="298.0" y="62.0" width="128.0" height="96.0" fill="#f2f6fa" rx="5.0"/>
<rect x="298.0" y="62.0" width="3.0" height="96.0" fill="#14496b" rx="0.0"/>
<text x="310.0" y="82.0" class="t-note" text-anchor="start">Etapa 3</text>
<text x="310.0" y="100.0" class="t-labb" text-anchor="start">Landscape 2026</text>
<text x="310.0" y="118.0" class="t-small" text-anchor="start">Productos vivos,</text>
<text x="310.0" y="131.0" class="t-small" text-anchor="start">discontinuados,</text>
<text x="310.0" y="144.0" class="t-small" text-anchor="start">adquiridos</text>
<path d="M430.0 110.0 h10 l-4 -4 m4 4 l-4 4" fill="none" stroke="#8a8880" stroke-width="1.6"/>
<rect x="446.0" y="62.0" width="128.0" height="96.0" fill="#f2f6fa" rx="5.0"/>
<rect x="446.0" y="62.0" width="3.0" height="96.0" fill="#14496b" rx="0.0"/>
<text x="458.0" y="82.0" class="t-note" text-anchor="start">Etapa 4</text>
<text x="458.0" y="100.0" class="t-labb" text-anchor="start">Whitespace</text>
<text x="458.0" y="118.0" class="t-small" text-anchor="start">Qué no resuelve</text>
<text x="458.0" y="131.0" class="t-small" text-anchor="start">el incumbente</text>
<path d="M578.0 110.0 h10 l-4 -4 m4 4 l-4 4" fill="none" stroke="#8a8880" stroke-width="1.6"/>
<rect x="594.0" y="62.0" width="128.0" height="96.0" fill="#f2f6fa" rx="5.0"/>
<rect x="594.0" y="62.0" width="3.0" height="96.0" fill="#14496b" rx="0.0"/>
<text x="606.0" y="82.0" class="t-note" text-anchor="start">Etapa 5</text>
<text x="606.0" y="100.0" class="t-labb" text-anchor="start">Caso de negocio</text>
<text x="606.0" y="118.0" class="t-small" text-anchor="start">Ticket, frecuencia,</text>
<text x="606.0" y="131.0" class="t-small" text-anchor="start">reutilización RI,</text>
<text x="606.0" y="144.0" class="t-small" text-anchor="start">moat</text>
<rect x="2.0" y="184.0" width="716.0" height="62.0" fill="#fff8e8" rx="5.0"/>
<rect x="2.0" y="184.0" width="3.0" height="62.0" fill="#fab219" rx="0.0"/>
<text x="14.0" y="204.0" class="t-labb" text-anchor="start">Filtro aplicado en toda etapa</text>
<text x="14.0" y="222.0" class="t-small" text-anchor="start">Toda afirmación se clasifica como hecho verificado, declaración de fabricante, inferencia de ingeniería o</text>
<text x="14.0" y="236.0" class="t-small" text-anchor="start">estimación propia. Una estimación nunca se presenta como dato publicado.</text>
<text x="2.0" y="294.0" class="t-note" text-anchor="start">Esquema del autor.</text>
</svg>
